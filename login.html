<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Mentormindz</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Fira+Sans:wght@600&display=swap">
  <style>
    :root {
      --brand: #4158d0;
      --accent: #c850c0;
      --highlight: #ffcc70;
      --white: #fff;
      --fg: #222;
      --bg: #f8f9fb;
      --shadow: 0 4px 16px rgba(65,88,208,0.14);
      --br: 30px;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      font-family: 'Inter', 'Fira Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
    }
    .card {
      background: var(--white);
      border-radius: var(--br);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 370px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-logo {
      background: linear-gradient(135deg, var(--brand) 60%, var(--accent) 100%);
      border-radius: 50%;
      width: 56px; height: 56px;
      display: flex;
      align-items: center; justify-content: center;
      color: var(--white);
      font-size: 1.9rem;
      font-weight: 900;
      box-shadow: 0 0 12px 4px #e7e7fa10;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hello-title {
      font-size: 1.35rem;
      font-family: 'Fira Sans', sans-serif;
      font-weight: 600;
      color: var(--brand);
      margin: 2px 0 0;
      letter-spacing: 0.1em;
      text-align: center;
    }
    .subtitle {
      font-size: 1rem;
      color: #6c6e75;
      margin-bottom: 23px;
      text-align: center;
      margin-top: 6px;
    }
    .auth-btn {
      width: 100%;
      height: 48px;
      border-radius: 24px;
      border: none;
      margin-top: 0;
      font-size: 1.06rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand);
      color: var(--white);
      box-shadow: 0 3px 8px #183acf12;
      transition: background .19s;
      cursor: pointer;
      margin-bottom: 9px;
    }
    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-btn.google {
      background: #fff;
      color: #222;
      border: 1px solid #e8eaf6;
    }
    .auth-btn.google:hover:not(:disabled) {
      background: #f4f8ff;
    }
    .auth-btn:not(.google):hover:not(:disabled) {
      background: var(--accent);
    }
    .auth-btn img {
      width: 21px;
      margin-right: 15px;
    }
    .switch-cta {
      color: var(--brand);
      background: none;
      border: none;
      font-size: 0.99rem;
      margin: 13px auto 0;
      cursor: pointer;
      text-decoration: underline;
      font-family: inherit;
      font-weight: 500;
      display: block;
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }
    input[type="email"], input[type="password"] {
      background: #f4f6fa;
      border-radius: 23px;
      border: 1px solid #d4d6de;
      height: 42px;
      padding: 0 18px;
      font-size: 1rem;
      color: #25263a;
    }
    input[type="email"]:focus, input[type="password"]:focus {
      outline: 2px solid var(--accent);
    }
    .err, .msg {
      width: 100%;
      padding: 8px 0 0;
      font-size: 0.98rem;
      text-align: center;
    }
    .err { color: #e0203f; }
    .msg { color: #27b040; }
    @media (max-width: 500px) {
      .card { padding: 15vw 5vw; max-width: 100vw;}
      .brand-logo { width: 48px;height:48px; font-size:1.2rem;}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-logo">
      <img src="logo_1.jpg" alt="Mentormindz Logo">
    </div>
    <div class="hello-title">Welcome Back, Mentormindz</div>
    <div class="subtitle">Login to your account</div>
    <button class="auth-btn google" id="googleBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
      Login with Google
    </button>
    <form id="mainForm">
      <input type="email" autocomplete="email" id="email" placeholder="Email address" required>
      <input type="password" autocomplete="current-password" id="password" placeholder="Password" minlength="6" required>
      <button type="submit" class="auth-btn" id="mainFormBtn">Login</button>
    </form>
    <button class="switch-cta" onclick="location.href='signin.html'">Don't have an account? Sign Up</button>
    <div class="err" id="err"></div>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const WORKER_URL = 'https://gateway3.rksreepathi1.workers.dev';

    const form = document.getElementById('mainForm');
    const err = document.getElementById('err');
    const msg = document.getElementById('msg');
    const googleBtn = document.getElementById('googleBtn');
    const submitBtn = document.getElementById('mainFormBtn');

    // Check for OAuth callback
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const idToken = urlParams.get('idToken');
      const error = urlParams.get('error');
      
      if (idToken) {
        localStorage.setItem('authToken', idToken);
        msg.textContent = 'Successfully logged in!';
        window.history.replaceState({}, document.title, window.location.pathname);
        setTimeout(() => window.location.href = 'index.html', 1000);
      } else if (error) {
        err.textContent = decodeURIComponent(error);
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        checkAuth();
      }
    });

    async function checkAuth() {
      const token = localStorage.getItem('authToken');
      if (!token) return;

      try {
        const resp = await fetch(`${WORKER_URL}/check-auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken: token })
        });

        if (resp.ok) {
          const data = await resp.json();
          if (data.valid) {
            window.location.href = 'index.html';
          } else {
            localStorage.removeItem('authToken');
          }
        } else {
          localStorage.removeItem('authToken');
        }
      } catch (e) {
        console.error('Auth check failed:', e);
        localStorage.removeItem('authToken');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      msg.textContent = '';
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const resp = await fetch(`${WORKER_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await resp.json();

        if (resp.ok && data.idToken) {
          msg.textContent = 'Successfully logged in!';
          localStorage.setItem('authToken', data.idToken);
          localStorage.setItem('userEmail', data.email || email);
          setTimeout(() => window.location.href = 'index.html', 500);
        } else {
          err.textContent = data.error || 'Login failed';
        }
      } catch (e) {
        err.textContent = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });

    googleBtn.addEventListener('click', () => {
      googleBtn.disabled = true;
      googleBtn.textContent = 'Redirecting...';
      const redirect = encodeURIComponent(window.location.origin + window.location.pathname);
      window.location.href = `${WORKER_URL}/google-login?redirect=${redirect}`;
    });
  </script>
</body>
</html>
