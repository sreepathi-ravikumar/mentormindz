<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Streaming Text + Video</title>

  <link rel="preconnect" href="https://ommuruga-package.hf.space">
  <link rel="dns-prefetch" href="https://ommuruga-package.hf.space">

  <style>
    body {
      font-family: system-ui;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #para {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 15px;
      border-radius: 8px;
      min-height: 60px;
    }

    video {
      width: 100%;
      margin-top: 16px;
      border-radius: 8px;
      background: black;
    }
  </style>
</head>
<body>

<h2>Ultra-Fast Streaming Demo</h2>

<textarea id="query" placeholder="Enter prompt..."></textarea>
<br>
<button onclick="generate()">Generate</button>

<p id="para"></p>
<div id="videos"></div>

<script>
async function generate() {
  const textEl = document.getElementById("para");
  const videosEl = document.getElementById("videos");

  textEl.textContent = "";
  videosEl.innerHTML = "";

  const response = await fetch(
    "https://ommuruga-package.hf.space/generate",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query: document.getElementById("query").value
      })
    }
  );

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split("\n\n");
    buffer = events.pop();

    for (const event of events) {

      // TEXT STREAM
      if (event.startsWith("event: text")) {
        const data = event.split("data:")[1];
        if (data) textEl.textContent += data;
      }

      // VIDEO CLIP
      if (event.startsWith("event: video_clip")) {
        const data = event.split("data:")[1];
        if (!data) continue;

        const clip = JSON.parse(data);

        const video = document.createElement("video");
        video.src = clip.url;
        video.controls = true;
        video.autoplay = true;
        video.muted = true;        // autoplay-safe
        video.playsInline = true;

        videosEl.appendChild(video);
      }
    }
  }
}
</script>

</body>
</html>
