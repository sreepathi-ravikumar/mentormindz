<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />

  <!-- Connection warm-up (keep) -->
  <link rel="preconnect" href="https://ommuruga-package.hf.space">
  <link rel="dns-prefetch" href="https://ommuruga-package.hf.space">

  <title>Ultra-Fast Streaming</title>

  <style>
    body { font-family: system-ui; padding: 20px; }
    #query { width: 500px; height: 80px; }
    #para { white-space: pre-wrap; }
    video { display: block; margin-top: 20px; }
  </style>
</head>
<body>

<textarea id="query" placeholder="Enter text"></textarea><br><br>
<button onclick="generate()">Generate</button>

<p id="para"></p>
<div id="videos"></div>

<script>
  let streamClosed = false;

  async function generate() {
    const textEl = document.getElementById("para");
    const videosEl = document.getElementById("videos");

    textEl.textContent = "";
    videosEl.innerHTML = "";
    
    // 🔥 CRITICAL: Reset stream state for new generation
    streamClosed = false;

    /* ===============================
       VIDEO: LIVE STREAM SETUP
       =============================== */

    const video = document.createElement("video");
    video.autoplay = true;
    video.controls = false;     // disabled until final clip
    video.muted = false;
    video.width = 500;

    const mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);

    videosEl.appendChild(video);

    let sourceBuffer;
    let bufferQueue = [];
    let mediaReady = false;

    mediaSource.addEventListener("sourceopen", () => {
      // ⚠️ Codec must match your clips
      const mime = 'video/mp4; codecs="avc1.42E01E"';

      if (!MediaSource.isTypeSupported(mime)) {
        console.error("MIME type not supported:", mime);
        return;
      }

      sourceBuffer = mediaSource.addSourceBuffer(mime);
      sourceBuffer.mode = "sequence"; // 🔥 CRITICAL for gap-free playback

      // 🔥 Setup updateend listener for queue processing
      sourceBuffer.addEventListener("updateend", () => {
        flushQueue();
      });

      mediaReady = true;
      flushQueue();
    });

    function flushQueue() {
      if (
        streamClosed ||
        !mediaReady ||
        !sourceBuffer ||
        sourceBuffer.updating ||
        bufferQueue.length === 0
      ) return;

      try {
        sourceBuffer.appendBuffer(bufferQueue.shift());
      } catch (e) {
        console.warn("appendBuffer error:", e);
        // Retry on next updateend
      }
    }

    async function appendClip(url) {
      if (streamClosed) return;

      try {
        const resp = await fetch(url);
        if (!resp.ok) {
          console.error("Failed to fetch clip:", url);
          return;
        }

        const buffer = await resp.arrayBuffer();

        if (streamClosed) return;  // double safety check

        bufferQueue.push(buffer);
        flushQueue();
      } catch (e) {
        console.error("Error fetching clip:", e);
      }
    }

    /* ===============================
       TEXT + EVENT STREAM
       =============================== */

    try {
      const response = await fetch(
        "https://ommuruga-package.hf.space/generate",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"  // 🔥 CRITICAL: Missing header
          },
          body: JSON.stringify({
            query: document.getElementById("query").value
          })
        }
      );

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const events = buffer.split("\n\n");
        buffer = events.pop();

        for (const event of events) {
          if (!event.trim()) continue;  // 🔥 Skip empty events

          /* ---------- TEXT STREAM ---------- */
          if (event.startsWith("event: text")) {
            const data = event.split("data:")[1];
            if (data) textEl.textContent += data.trim();
          }

          /* ---------- VIDEO CLIP ---------- */
          if (event.startsWith("event: video_clip")) {
            const dataLine = event.split("data:")[1];
            if (!dataLine) continue;

            try {
              const clip = JSON.parse(dataLine.trim());
              if (clip.url) {
                await appendClip(clip.url);  // 🔥 Await to handle errors properly
              }
            } catch (e) {
              console.error("Error parsing video clip JSON:", e);
            }
          }

          /* ---------- VIDEO END ---------- */
          if (event.startsWith("event: video_end")) {
            streamClosed = true;

            const finalize = () => {
              if (mediaSource.readyState === "open") {
                try {
                  mediaSource.endOfStream();
                  video.controls = true;   // enable controls ONLY now
                } catch (e) {
                  console.error("Error ending stream:", e);
                }
              }
            };

            // 🔥 Wait for all buffers to be appended
            if (sourceBuffer && sourceBuffer.updating) {
              sourceBuffer.addEventListener("updateend", finalize, { once: true });
            } else if (bufferQueue.length > 0) {
              // Wait for queue to flush
              const waitForQueue = setInterval(() => {
                if (bufferQueue.length === 0 && !sourceBuffer.updating) {
                  clearInterval(waitForQueue);
                  finalize();
                }
              }, 100);
            } else {
              finalize();
            }
          }
        }
      }
    } catch (e) {
      console.error("Stream error:", e);
      textEl.textContent += "\n\nError: " + e.message;
    }
  }
</script>

</body>
</html>
