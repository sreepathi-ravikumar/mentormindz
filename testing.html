<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ultra-Fast Streaming</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 800px; margin: 0 auto; }
    #query { width: 100%; height: 80px; padding: 10px; }
    #para { white-space: pre-wrap; background: #f4f4f4; padding: 15px; border-radius: 8px; min-height: 50px;}
    video { display: block; margin-top: 20px; background: #000; width: 100%; border-radius: 8px; }
    #status { color: #666; font-size: 12px; margin-top: 10px; font-family: monospace; }
    button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

<textarea id="query" placeholder="Enter prompt here..."></textarea><br><br>
<button onclick="generate()">Generate Stream</button>

<div id="status"></div>
<p id="para"></p>
<div id="videos"></div>

<script>
  let currentController = null;

  async function generate() {
    const textEl = document.getElementById("para");
    const videosEl = document.getElementById("videos");
    const statusEl = document.getElementById("status");

    // Reset UI
    textEl.textContent = "";
    videosEl.innerHTML = "";
    statusEl.textContent = "Initializing...";

    if (currentController) currentController.abort();
    currentController = new AbortController();
    const signal = currentController.signal;

    // 1. SETUP VIDEO PLAYER
    const video = document.createElement("video");
    video.controls = true;
    
    // CRITICAL FIX: Start muted to allow autoplay
    video.muted = true; 
    video.autoplay = true;
    video.playsInline = true;
    
    videosEl.appendChild(video);

    // 2. SETUP MEDIA SOURCE
    const mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);

    let sourceBuffer = null;
    let queue = [];
    let isAppending = false;

    mediaSource.addEventListener("sourceopen", () => {
        // CRITICAL FIX: Declare BOTH Video (avc1) and Audio (mp4a) codecs
        // This must match the FFmpeg output exactly
        const mime = 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"';

        if (MediaSource.isTypeSupported(mime)) {
            sourceBuffer = mediaSource.addSourceBuffer(mime);
            
            // "sequence" mode makes the browser automatically stitch clips 
            // regardless of their internal timestamps
            sourceBuffer.mode = 'sequence'; 
            
            sourceBuffer.addEventListener('updateend', processQueue);
            statusEl.textContent = "✅ System Ready. Waiting for data...";
        } else {
            statusEl.textContent = "❌ MIME type not supported on this browser.";
        }
    });

    function processQueue() {
        if (!sourceBuffer || sourceBuffer.updating || queue.length === 0) return;

        const chunk = queue.shift();
        try {
            sourceBuffer.appendBuffer(chunk);
        } catch (e) {
            console.error("Append Error:", e);
            // If quota exceeded, we might need to remove old buffer, 
            // but for short clips, this usually means corrupt data.
        }
    }

    // 3. FETCH STREAM
    try {
        const response = await fetch("https://ommuruga-package.hf.space/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: document.getElementById("query").value }),
            signal
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n\n");
            buffer = lines.pop();

            for (const line of lines) {
                if (line.startsWith("event: text")) {
                    const data = line.replace("event: text", "").replace("data: ", "").trim();
                    textEl.textContent += data;
                } 
                else if (line.startsWith("event: video_clip")) {
                    const jsonStr = line.split("data: ")[1];
                    try {
                        const clipData = JSON.parse(jsonStr);
                        console.log("📥 Loading clip:", clipData.url);
                        
                        // Fetch the video file as an ArrayBuffer
                        const vidResp = await fetch(clipData.url);
                        const vidBuffer = await vidResp.arrayBuffer();
                        
                        queue.push(vidBuffer);
                        processQueue();
                        
                    } catch (e) {
                        console.error("Error parsing/fetching clip", e);
                    }
                }
                else if (line.startsWith("event: video_end")) {
                    // Wait for queue to empty before ending stream
                    const checkEnd = setInterval(() => {
                        if (queue.length === 0 && !sourceBuffer.updating) {
                            clearInterval(checkEnd);
                            if (mediaSource.readyState === 'open') {
                                mediaSource.endOfStream();
                                statusEl.textContent = "✨ Generation Complete";
                            }
                        }
                    }, 500);
                }
            }
        }
    } catch (err) {
        if (err.name !== 'AbortError') {
            statusEl.textContent = "❌ Error: " + err.message;
        }
    }
  }
</script>
</body>
</html>
