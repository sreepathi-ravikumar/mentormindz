<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />

  <!-- Connection warm-up (keep) -->
  <link rel="preconnect" href="https://ommuruga-package.hf.space">
  <link rel="dns-prefetch" href="https://ommuruga-package.hf.space">

  <title>Ultra-Fast Streaming</title>

  <style>
    body { font-family: system-ui; padding: 20px; }
    #query { width: 500px; height: 80px; }
    #para { white-space: pre-wrap; }
    video { display: block; margin-top: 20px; }
    #status { color: #666; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>

<textarea id="query" placeholder="Enter text"></textarea><br><br>
<button onclick="generate()">Generate</button>

<p id="para"></p>
<div id="status"></div>
<div id="videos"></div>

<script>
  let currentGeneration = null;

  async function generate() {
    const textEl = document.getElementById("para");
    const videosEl = document.getElementById("videos");
    const statusEl = document.getElementById("status");

    textEl.textContent = "";
    videosEl.innerHTML = "";
    statusEl.textContent = "";

    // 🔥 CRITICAL: Cancel previous generation
    if (currentGeneration) {
      currentGeneration.abort();
    }

    // Create new generation context
    currentGeneration = {
      abort: () => { currentGeneration.active = false; },
      active: true
    };

    const generation = currentGeneration;

    /* ===============================
       VIDEO: LIVE STREAM SETUP
       =============================== */

    const video = document.createElement("video");
    video.autoplay = true;
    video.controls = false;
    video.muted = false;
    video.width = 500;

    const mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);

    videosEl.appendChild(video);

    let sourceBuffer = null;
    let bufferQueue = [];
    let mediaReady = false;
    let allClipsReceived = false;
    let clipCount = 0;

    mediaSource.addEventListener("sourceopen", () => {
      if (!generation.active) return;

      const mime = 'video/mp4; codecs="avc1.42E01E"';

      if (!MediaSource.isTypeSupported(mime)) {
        console.error("MIME type not supported:", mime);
        statusEl.textContent = "❌ MIME type not supported";
        return;
      }

      try {
        sourceBuffer = mediaSource.addSourceBuffer(mime);
        sourceBuffer.mode = "sequence";

        sourceBuffer.addEventListener("updateend", () => {
          if (generation.active) {
            flushQueue();
          }
        });

        mediaReady = true;
        statusEl.textContent = "✅ MediaSource ready";
        flushQueue();
      } catch (e) {
        console.error("SourceBuffer creation error:", e);
        statusEl.textContent = "❌ SourceBuffer error: " + e.message;
      }
    });

    function flushQueue() {
      // 🔥 CRITICAL: Check if sourceBuffer is still valid
      if (
        !generation.active ||
        !mediaReady ||
        !sourceBuffer ||
        sourceBuffer.updating ||
        bufferQueue.length === 0
      ) {
        // Check if we're done
        if (allClipsReceived && bufferQueue.length === 0 && sourceBuffer && !sourceBuffer.updating) {
          finalizeStream();
        }
        return;
      }

      // 🔥 Double-check sourceBuffer parent before appending
      try {
        if (!mediaSource || mediaSource.readyState !== "open") {
          console.warn("MediaSource not open, clearing queue");
          bufferQueue = [];
          return;
        }

        const buffer = bufferQueue.shift();
        sourceBuffer.appendBuffer(buffer);
      } catch (e) {
        console.error("appendBuffer error:", e);
        statusEl.textContent = "❌ Append error: " + e.message;
        bufferQueue = [];
      }
    }

    async function appendClip(url) {
      if (!generation.active) return;

      clipCount++;
      const currentClip = clipCount;

      try {
        // 🔥 Force fresh fetch (avoid 304)
        const resp = await fetch(url, {
          cache: "no-cache",  // Prevent 304 if you want fresh data
          // OR use: cache: "default" to allow 304 (faster, uses cache)
        });

        // ✅ Accept both 200 and 206 (partial content) and 304
        if (!resp.ok && resp.status !== 206 && resp.status !== 304) {
          console.error(`Clip ${currentClip} failed: ${resp.status}`);
          statusEl.textContent = `⚠️ Clip ${currentClip}: Status ${resp.status}`;
          return;
        }

        console.log(`✅ Clip ${currentClip}: Status ${resp.status}`);

        const buffer = await resp.arrayBuffer();

        // 🔥 Check if still active after async operation
        if (!generation.active || !mediaReady) return;

        bufferQueue.push(buffer);
        statusEl.textContent = `📦 Clips loaded: ${currentClip} | Queue: ${bufferQueue.length}`;
        flushQueue();
      } catch (e) {
        console.error(`Error fetching clip ${currentClip}:`, e);
        statusEl.textContent = `❌ Clip ${currentClip} error: ${e.message}`;
      }
    }

    function finalizeStream() {
      if (!generation.active) return;
      
      try {
        if (mediaSource && mediaSource.readyState === "open") {
          mediaSource.endOfStream();
          video.controls = true;
          statusEl.textContent = `✅ Stream complete! ${clipCount} clips loaded`;
        }
      } catch (e) {
        console.error("Error ending stream:", e);
        statusEl.textContent = "❌ Finalize error: " + e.message;
      }
    }

    /* ===============================
       TEXT + EVENT STREAM
       =============================== */

    try {
      const response = await fetch(
        "https://ommuruga-package.hf.space/generate",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            query: document.getElementById("query").value
          })
        }
      );

      console.log(`📡 Text stream: Status ${response.status}`);

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (generation.active) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const events = buffer.split("\n\n");
        buffer = events.pop();

        for (const event of events) {
          if (!event.trim() || !generation.active) continue;

          /* ---------- TEXT STREAM ---------- */
          if (event.startsWith("event: text")) {
            const data = event.split("data:")[1];
            if (data) textEl.textContent += data.trim();
          }

          /* ---------- VIDEO CLIP ---------- */
          if (event.startsWith("event: video_clip")) {
            const dataLine = event.split("data:")[1];
            if (!dataLine) continue;

            try {
              const clip = JSON.parse(dataLine.trim());
              if (clip.url) {
                appendClip(clip.url);  // Don't await - let it queue
              }
            } catch (e) {
              console.error("Error parsing video clip JSON:", e);
            }
          }

          /* ---------- VIDEO END ---------- */
          if (event.startsWith("event: video_end")) {
            allClipsReceived = true;

            // Try to finalize if queue is empty
            if (bufferQueue.length === 0 && sourceBuffer && !sourceBuffer.updating) {
              finalizeStream();
            } else if (sourceBuffer) {
              // Wait for queue to finish
              sourceBuffer.addEventListener("updateend", function checkFinish() {
                if (bufferQueue.length === 0 && !sourceBuffer.updating) {
                  sourceBuffer.removeEventListener("updateend", checkFinish);
                  finalizeStream();
                }
              });
            }
          }
        }
      }
    } catch (e) {
      console.error("Stream error:", e);
      if (generation.active) {
        textEl.textContent += "\n\nError: " + e.message;
        statusEl.textContent = "❌ Stream error: " + e.message;
      }
    }
  }
</script>

</body>
</html>
