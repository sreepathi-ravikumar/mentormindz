<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .star {
      cursor: pointer;
      font-size: 2rem;
      color: #9ca3af; /* gray-400 */
      transition: color 0.2s;
      user-select: none;
    }
    .star.selected {
      color: #f59e0b; /* amber-500 (gold-like) */
    }
  </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-xl">
    <!-- LOGO -->
    <div class="text-center mb-6">
      <img src="logo.jpg" alt="Mentormindz Logo" class="mx-auto h-10 mb-2" />
      <h2 class="text-2xl font-bold text-gray-800">We'd Love Your Feedback</h2>
      <p class="text-gray-500 text-sm">Help us improve by sharing your thoughts</p>
    </div>

    <!-- Feedback Form -->
    <form id="feedback-form" class="space-y-4" novalidate>
      <div>
        <input type="text" id="name" placeholder="Your Name" required
               class="w-full p-3 border border-gray-300 rounded-xl" />
        <p id="name-error" class="text-red-600 text-sm mt-1 hidden">Please enter your name.</p>
      </div>

      <div>
        <input type="email" id="email" placeholder="Your Email" required
               class="w-full p-3 border border-gray-300 rounded-xl" />
        <p id="email-error" class="text-red-600 text-sm mt-1 hidden">Please enter a valid email.</p>
      </div>

      <!-- Star Rating -->
      <div class="text-center">
        <label class="block mb-2 font-medium text-gray-700">Rate Us</label>
        <!-- Tip: remove flex-row-reverse if you want left-to-right 1→5 -->
        <div id="stars" class="flex justify-center gap-2" role="radiogroup" aria-label="Star rating">
          <span class="star" data-value="1" role="radio" aria-checked="false" tabindex="0">&#9733;</span>
          <span class="star" data-value="2" role="radio" aria-checked="false" tabindex="-1">&#9733;</span>
          <span class="star" data-value="3" role="radio" aria-checked="false" tabindex="-1">&#9733;</span>
          <span class="star" data-value="4" role="radio" aria-checked="false" tabindex="-1">&#9733;</span>
          <span class="star" data-value="5" role="radio" aria-checked="false" tabindex="-1">&#9733;</span>
        </div>
        <input type="hidden" id="rating" name="rating" required />
        <p id="rating-error" class="text-red-600 text-sm mt-1 hidden">Please select a star rating.</p>
      </div>

      <div>
        <textarea id="message" rows="5" placeholder="Your Feedback..." required
                  class="w-full p-3 border border-gray-300 rounded-xl"></textarea>
        <p id="message-error" class="text-red-600 text-sm mt-1 hidden">Please enter your feedback.</p>
      </div>

      <button id="submit-btn" type="submit"
              class="bg-blue-600 text-white font-semibold py-3 px-6 rounded-xl w-full hover:bg-blue-700 transition duration-200">
        Submit Feedback
      </button>
      <p id="submit-status" class="text-center text-sm mt-2 text-gray-500"></p>
    </form>
  </div>

  <script>
    const stars = document.querySelectorAll('.star');
    const starsContainer = document.getElementById('stars');
    const ratingInput = document.getElementById('rating');
    const submitBtn = document.getElementById('submit-btn');
    const statusEl = document.getElementById('submit-status');

    const nameEl = document.getElementById('name');
    const emailEl = document.getElementById('email');
    const messageEl = document.getElementById('message');

    const nameErr = document.getElementById('name-error');
    const emailErr = document.getElementById('email-error');
    const ratingErr = document.getElementById('rating-error');
    const messageErr = document.getElementById('message-error');

    function highlightStars(value) {
      const selectedValue = Number(value) || 0;
      stars.forEach(star => {
        const v = Number(star.dataset.value);
        star.classList.toggle('selected', v <= selectedValue);
        star.setAttribute('aria-checked', v === selectedValue ? 'true' : 'false');
      });
    }

    function setRating(value) {
      ratingInput.value = value;
      highlightStars(value);
    }

    // Mouse interactions
    stars.forEach(star => {
      star.addEventListener('mouseover', () => highlightStars(star.dataset.value));
      star.addEventListener('click', () => setRating(star.dataset.value));
    });

    // Touch interactions
    stars.forEach(star => {
      star.addEventListener('touchstart', (e) => {
        e.preventDefault();
        setRating(star.dataset.value);
      }, { passive: false });
    });

    // Keyboard accessibility
    starsContainer.addEventListener('keydown', (e) => {
      const current = Number(ratingInput.value) || 0;
      if (e.key === 'ArrowRight') {
        const next = Math.min(current + 1, 5);
        setRating(next);
      } else if (e.key === 'ArrowLeft') {
        const prev = Math.max(current - 1, 1);
        setRating(prev);
      } else if (e.key === 'Enter' || e.key === ' ') {
        if (!current) setRating(3); // default to middle if none
      }
    });

    // Reset hover state when leaving stars
    starsContainer.addEventListener('mouseleave', () => {
      const selectedRating = Number(ratingInput.value);
      highlightStars(selectedRating);
    });

    // Basic sanitization
    function sanitize(str) {
      return String(str).replace(/[<>]/g, '');
    }

    function validEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showError(el, msgEl, condition) {
      if (condition) {
        msgEl.classList.remove('hidden');
        el.classList.add('border-red-500');
      } else {
        msgEl.classList.add('hidden');
        el.classList.remove('border-red-500');
      }
    }

    async function submitFeedback(e) {
      e.preventDefault();

      const name = sanitize(nameEl.value.trim());
      const email = emailEl.value.trim();
      const rating = ratingInput.value.trim();
      const message = sanitize(messageEl.value.trim());

      const nameInvalid = !name;
      const emailInvalid = !validEmail(email);
      const ratingInvalid = !rating;
      const messageInvalid = !message;

      showError(nameEl, nameErr, nameInvalid);
      showError(emailEl, emailErr, emailInvalid);
      showError(messageEl, messageErr, messageInvalid);
      showError(starsContainer, ratingErr, ratingInvalid);

      if (nameInvalid || emailInvalid || ratingInvalid || messageInvalid) return;

      const data = { name, email, rating, message, source: 'web', timestamp: new Date().toISOString() };

      try {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
        statusEl.textContent = 'Submitting...';

        const response = await fetch('https://script.google.com/macros/s/AKfycbwq3nMn69Cj3DaowTnQ7ToipneU_if-In271RUEGMIxsCKNmMPDWwZLkWYbenbbP1aqSw/exec', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || 'Network response was not ok');
        }

        const result = await response.json().catch(() => ({}));
        statusEl.textContent = '✅ Thank you for your feedback!';
        // Reset form
        document.getElementById('feedback-form').reset();
        ratingInput.value = '';
        highlightStars(0);
        // Optional: focus name for quick repeat
        nameEl.focus();
      } catch (err) {
        console.error(err);
        statusEl.textContent = '❌ Submission failed. Please try again.';
        alert('❌ Submission failed. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
      }
    }

    document.getElementById('feedback-form').addEventListener('submit', submitFeedback);
  </script>
</body>
</html>
